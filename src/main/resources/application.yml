firebase:
  project-id: ${PROJECT_ID}
  credentials: ${CRED_FILE}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    banner-mode: console

rabbit:
  host: ${RABBIT_HOST}
  user: ${RABBIT_USER}
  pass: ${RABBIT_PASS}
  port: ${RABBIT_PORT}

jobs:
  watch:
    enabled: false

queue:
  test: test_queue
  ha: ha_queue_last_hr

admin:
  email: ${ADMIN_EMAIL}

ws:
  broadcast:
    interval: ${WS_BS_INT}
  haier:
    broadcast:
      interval: ${WS_HAIER_BS_INT:5000}




logging:
  level:
    org.springframework.amqp: INFO
    org.springframework.amqp.rabbit: INFO
    com.rabbitmq: INFO
    org.springframework.retry: INFO
    org.springframework.boot.autoconfigure.amqp: INFO
    pl.kmalysiak.notificator.rabbit: debug
    pl.kmalysiak: DEBUG


