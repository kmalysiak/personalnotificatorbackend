firebase:
  project-id: ${PROJECT_ID}
  credentials: ${CRED_FILE}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

rabbit:
  host: ${RABBIT_HOST}
  user: ${RABBIT_USER}
  pass: ${RABBIT_PASS}
  port: ${RABBIT_PORT}

jobs:
  watch:
   enabled: false

queue:
  test: test_queue
  ha: ha_queue_last_hr

admin:
  email: ${ADMIN_EMAIL}

logging:
  level:
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit: DEBUG
    com.rabbitmq: DEBUG
    org.springframework.retry: DEBUG
    org.springframework.boot.autoconfigure.amqp: DEBUG


